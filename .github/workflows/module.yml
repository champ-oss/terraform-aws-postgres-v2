name: module

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: "0 7 * * *"

concurrency: this

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  TF_STATE_BUCKET: "env-tfbackend-oss-backend"
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  # Fully mocked. No AWS credentials, no resources, no cost, ~10s. Gates the
  # real apply below so a broken module never reaches an AWS account.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: copy lockfile
        run: cp examples/complete/.terraform.lock.hcl . || true
      - name: init
        run: terraform init -backend=false
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        run: terraform validate
      - name: test
        run: terraform test

  # Real apply and destroy against AWS. Manual only: `gh workflow run module`
  # or the Run workflow button. Push and schedule stop at the mocked suite,
  # which cannot see AWS API rejections -- an engine version that is not
  # available in the region, a KMS policy that denies rds.amazonaws.com, a
  # quota. Dispatch this before tagging a release.
  list-examples:
    needs: [test]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        working-directory: examples
        run: |
          EXAMPLES=$(ls -1 | jq -Rsc '. / "\n" - [""]')
          echo $EXAMPLES
          echo "EXAMPLES=$EXAMPLES" >> $GITHUB_OUTPUT
    outputs:
      EXAMPLES: ${{ steps.set-matrix.outputs.EXAMPLES }}
  run-example:
    needs: list-examples
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        EXAMPLES: ${{ fromJson(needs.list-examples.outputs.EXAMPLES) }}
    defaults:
      run:
        shell: bash
        working-directory: examples/${{ matrix.EXAMPLES }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - uses: hashicorp/setup-terraform@v4 # https://github.com/hashicorp/setup-terraform/releases
        with:
          terraform_version: 1.12.2 # https://github.com/hashicorp/terraform/releases
          terraform_wrapper: false
      - name: copy lockfile
        run: cp ../complete/.terraform.lock.hcl . || true
      - name: init
        run: terraform init
      - name: disable prevent_destroy
        working-directory: .
        run: find . -type f -name '*.tf' -exec sed -i'' -e 's/prevent_destroy = true/prevent_destroy = false/g' {} +
      - name: validate
        run: terraform validate
      - name: plan
        run: terraform plan -out=tfplan
      - name: apply
        run: terraform apply -auto-approve tfplan
      - name: check
        run: terraform plan -detailed-exitcode
      - name: integration test
        run: |
          for row in $(echo $(terraform output -json) | jq -c '. | to_entries[]'); do
            key=$(echo $row | jq -r '.key' | tr '[:lower:]' '[:upper:]')
            value=$(echo $row | jq -r '.value.value' | tr -d '\n[]" ')
            echo $key=$value
            export $key=$value
          done
          if [ -f test.sh ]; then bash test.sh; fi
      - name: destroy
        if: always()
        run: terraform destroy -auto-approve
  module:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [test, run-example]
    steps:
      # 'skipped' is not a failure here: run-example is skipped on every push
      # and scheduled run by design. A genuine upstream failure still shows up
      # as 'failure' on the job that failed.
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
